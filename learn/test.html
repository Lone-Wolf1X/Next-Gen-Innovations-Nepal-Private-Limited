<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Test | GyanBazi</title>
  <link rel="icon" href="/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/learn/css/learn-platform.css">
  <style>
    body { background: var(--bg); overflow-x: hidden; }
    .test-main { margin-right: 280px; }
    @media(max-width:768px) { .test-main { margin-right: 0; } }
  </style>
  <link rel="manifest" href="/learn/manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="logo">NL</div>
  <div class="loading-spinner"></div>
</div>

<!-- TOP BAR -->
<div class="test-topbar" id="testTopbar" style="display:none;">
  <div>
    <div class="test-name" id="testName">Loading...</div>
    <div class="test-progress" id="currentQNum">Q 1 of 0</div>
  </div>

  <!-- Progress Bar (thin, under topbar text) -->
  <div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--border);">
    <div id="progressBar" style="height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0%;transition:width 0.3s ease;"></div>
  </div>

  <div class="test-timer" id="timerWrap">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/></svg>
    <span id="testTimer">00:00</span>
  </div>

  <button class="btn btn-danger btn-sm" onclick="TestEngine.promptSubmit()">Submit Test</button>
</div>

<!-- MAIN TEST AREA -->
<div class="test-main" id="testMain" style="display:none;padding-top:80px;padding-left:24px;padding-right:24px;padding-bottom:40px;max-width:800px;">
  <div id="questionArea"><!-- Rendered by TestEngine --></div>
</div>

<!-- QUESTION NAVIGATOR SIDEBAR -->
<div class="test-sidebar-panel" id="testSidebar" style="display:none;">
  <div class="test-sidebar-header">Question Navigator</div>
  <div class="question-navigator" id="questionNavigator"><!-- Rendered by TestEngine --></div>
  <div id="navSummary"></div>
  <div class="nav-legend">
    <div class="legend-item"><div class="legend-dot not-visited"></div>Not Visited</div>
    <div class="legend-item"><div class="legend-dot visited-d"></div>Visited</div>
    <div class="legend-item"><div class="legend-dot answered-d"></div>Answered</div>
    <div class="legend-item"><div class="legend-dot marked-d"></div>Marked</div>
  </div>
  <div class="test-actions">
    <button class="btn btn-danger w-full" onclick="TestEngine.promptSubmit()">
      Submit Test
    </button>
    <button class="btn btn-ghost btn-sm w-full" style="margin-top:6px;" id="mobileNavClose" onclick="document.getElementById('testSidebar').classList.remove('mobile-open')">
      Close
    </button>
  </div>
</div>

<!-- Mobile Nav Toggle (visible on small screens) -->
<button id="mobileNavBtn" onclick="document.getElementById('testSidebar').classList.toggle('mobile-open')"
  style="display:none;position:fixed;bottom:20px;right:20px;z-index:60;background:var(--primary);color:white;border:none;border-radius:50%;width:52px;height:52px;font-size:1.1rem;cursor:pointer;box-shadow:0 4px 16px rgba(37,99,235,0.4);">
  ≡
</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/learn/js/firebase-config.js"></script>
<script src="/learn/js/auth.js?v=5"></script>
<script src="/learn/js/db.js?v=6"></script>
<script src="/learn/js/test-engine.js"></script>
<script>
async function initTest() {
  const params = new URLSearchParams(window.location.search);
  const modelSetId = params.get('set');
  if (!modelSetId) { window.location.href = '/learn/categories.html'; return; }

  const user = await Auth.requireAuth();

  try {
    const { setData } = await TestEngine.init(modelSetId, user.uid);

    // Update UI
    document.getElementById('testName').textContent = setData.title;

    // Show UI
    document.getElementById('pageLoader').style.display = 'none';
    document.getElementById('testTopbar').style.display = 'flex';
    document.getElementById('testMain').style.display = 'block';
    document.getElementById('testSidebar').style.display = 'flex';

    // Handle mobile
    if (window.innerWidth <= 768) {
      document.getElementById('mobileNavBtn').style.display = 'flex';
      document.getElementById('mobileNavClose').style.display = 'block';
    }

    // Render first question and navigator
    TestEngine.renderQuestion();
    TestEngine.updateNavigator();

    // Start timer with auto-submit on expire
    TestEngine.startTimer(
      null, // no per-tick callback needed
      () => {
        showToast('⏰ Time is up! Auto-submitting...', 'warning', 5000);
        setTimeout(() => TestEngine.submitTest(true), 1500);
      }
    );

    // Start auto-save
    TestEngine.startAutoSave();

    // Warn on page leave
    TestEngine.enableUnloadWarning();

  } catch (err) {
    console.error(err);
    
    // Freemium logic: limit reached
    if (err.message.includes('Daily limit reached') || err.message.includes('upgrade to Premium')) {
      document.getElementById('pageLoader').innerHTML = `
        <div style="text-align:center;padding:40px;background:var(--bg-secondary);border-radius:12px;box-shadow:var(--shadow-lg);max-width:400px;margin:10vh auto;">
          <div style="font-size:3rem;margin-bottom:16px;">👑</div>
          <h3 style="margin-bottom:8px;font-size:1.5rem;">Daily Limit Reached</h3>
          <p style="color:var(--text-muted);margin-bottom:24px;line-height:1.5;">You've used up your 2 free tests for today. Upgrade to Premium to unlock unlimited tests, detailed analytics, and access to all model sets.</p>
          <button class="btn btn-primary w-full" style="margin-bottom:12px;background:linear-gradient(135deg, #F59E0B, #D97706);border:none;" onclick="alert('Payment Gateway Integration Pending!')">Upgrade to Premium - Rs. 999</button>
          <a href="/learn/index.html" class="btn btn-ghost w-full">Back to Dashboard</a>
        </div>
      `;
    } else {
      // General error
      document.getElementById('pageLoader').innerHTML = `
        <div style="text-align:center;padding:40px;">
          <div style="font-size:2rem;margin-bottom:12px;">⚠️</div>
          <h3>Failed to load test</h3>
          <p style="color:var(--text-muted);margin:10px 0 20px;">${err.message}</p>
          <a href="/learn/categories.html" class="btn btn-primary">← Back to Categories</a>
        </div>`;
    }
  }
}

initTest();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/learn/sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW fail: ', err));
    });
  }
</script>
</body>
</html>
