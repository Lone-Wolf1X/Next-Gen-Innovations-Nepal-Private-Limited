<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories | Admin | GyanBazi</title>
  <link rel="icon" href="/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/learn/css/learn-platform.css">
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="logo">NL</div><div class="loading-spinner"></div></div>

<!-- Category Modal -->
<div class="modal-backdrop" id="catModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="catModalTitle">Add Category</h3>
      <button class="modal-close" onclick="closeCatModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Category Name *</label>
        <input class="form-input" id="cName" placeholder="e.g. Banking Exams" required>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Icon (emoji)</label>
        <input class="form-input" id="cIcon" placeholder="🏦" maxlength="4">
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="cDesc" rows="2" placeholder="Brief description..."></textarea>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Display Order</label>
        <input class="form-input" type="number" id="cOrder" value="1" min="1">
      </div>
      <div class="form-group">
        <label class="form-label">Status</label>
        <select class="form-select" id="cActive">
          <option value="true">Active (visible to users)</option>
          <option value="false">Hidden</option>
        </select>
      </div>
      <input type="hidden" id="cId">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeCatModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveCategory()" id="catSaveBtn">Save</button>
    </div>
  </div>
</div>

<!-- Subject Modal -->
<div class="modal-backdrop" id="subModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title" id="subModalTitle">Add Subject</h3>
      <button class="modal-close" onclick="document.getElementById('subModal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Subject Name *</label>
        <input class="form-input" id="sName" placeholder="e.g. General Knowledge" required>
      </div>
      <div class="form-group" style="margin-bottom:14px;">
        <label class="form-label">Under Category</label>
        <select class="form-select" id="sParentCat"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Display Order</label>
        <input class="form-input" type="number" id="sOrder" value="1" min="1">
      </div>
      <input type="hidden" id="sId">
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="document.getElementById('subModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="saveSubject()" id="subSaveBtn">Save</button>
    </div>
  </div>
</div>

<div class="app-layout" id="appLayout" style="display:none;">
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="sidebar-logo" style="background:linear-gradient(135deg,#DC2626,#B91C1C);">A</div><div><div class="sidebar-name">Admin Panel</div><div class="sidebar-tagline">GyanBazi</div></div></div>
    <nav class="sidebar-nav">
      <a href="/learn/admin/index.html" class="sidebar-link"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>Dashboard</a>
      <a href="/learn/admin/categories.html" class="sidebar-link active"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>Categories & Subjects</a>
      <a href="/learn/admin/questions.html" class="sidebar-link"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-8-3a1 1 0 00-.867.5 1 1 0 11-1.731-1A3 3 0 0113 8a3.001 3.001 0 01-2 2.83V11a1 1 0 11-2 0v-1a1 1 0 011-1 1 1 0 100-2zm0 8a1 1 0 100-2 1 1 0 000 2z" clip-rule="evenodd"/></svg>Questions</a>
      <a href="/learn/admin/modelsets.html" class="sidebar-link"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M9 2a1 1 0 000 2h2a1 1 0 100-2H9z"/><path fill-rule="evenodd" d="M4 5a2 2 0 012-2 3 3 0 003 3h2a3 3 0 003-3 2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" clip-rule="evenodd"/></svg>Model Sets</a>
      <a href="/learn/index.html" class="sidebar-link"><svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>Back to Platform</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="Auth.signOut()"><div class="sidebar-avatar" id="adminAvatar">A</div><div class="sidebar-user-info"><div class="sidebar-user-name" id="adminName">Admin</div></div></div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-topbar">
      <div><div class="page-title">Categories & Subjects</div><div class="page-subtitle">Manage exam categories and subject breakdowns</div></div>
      <div class="topbar-right">
        <button class="btn btn-outline btn-sm" onclick="openSubModal()">+ Add Subject</button>
        <button class="btn btn-primary btn-sm" onclick="openCatModal()">+ Add Category</button>
      </div>
    </div>
    <div class="page-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">

        <!-- Categories -->
        <div>
          <div class="section-head" style="margin-bottom:12px;">
            <div class="section-head-title">Exam Categories</div>
          </div>
          <div class="card">
            <div id="catsTableWrap"><div style="padding:20px;"><div class="skeleton" style="height:40px;margin-bottom:8px;"></div><div class="skeleton" style="height:40px;"></div></div></div>
          </div>
        </div>

        <!-- Subjects -->
        <div>
          <div class="section-head" style="margin-bottom:12px;">
            <div class="section-head-title">Subjects</div>
          </div>
          <div class="card">
            <div id="subsTableWrap"><div style="padding:20px;"><div class="skeleton" style="height:40px;margin-bottom:8px;"></div><div class="skeleton" style="height:40px;"></div></div></div>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<div class="toast-container"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/learn/js/firebase-config.js"></script>
<script src="/learn/js/auth.js"></script>
<script src="/learn/js/db.js"></script>
<script>
let currentUser, allCats = [], allSubs = [], editingCatId = null, editingSubId = null;

async function init() {
  currentUser = await Auth.requireAdmin();
  document.getElementById('adminAvatar').textContent = (currentUser.displayName||'A')[0];
  document.getElementById('adminName').textContent = currentUser.displayName || 'Admin';
  await loadAll();
  document.getElementById('pageLoader').style.display = 'none';
  document.getElementById('appLayout').style.display = 'flex';
}

async function loadAll() {
  [allCats, allSubs] = await Promise.all([DB.categories.getAllAdmin(), DB.subjects.getAll()]);
  renderCats(); renderSubs();
  const opts = allCats.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  document.getElementById('sParentCat').innerHTML = `<option value="">None</option>${opts}`;
}

function renderCats() {
  const wrap = document.getElementById('catsTableWrap');
  if (!allCats.length) { wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">🏷️</div><div class="empty-title">No categories yet</div></div>`; return; }
  const rows = allCats.map(c => `
    <tr>
      <td><span style="font-size:1.2rem;">${c.icon||'📚'}</span></td>
      <td><div style="font-weight:600;font-size:0.875rem;">${c.name}</div></td>
      <td><span class="badge ${c.isActive?'badge-success':'badge-neutral'}">${c.isActive?'Active':'Hidden'}</span></td>
      <td><div class="table-actions">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="editCat('${c.id}')">✏️</button>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="deleteCat('${c.id}')">🗑️</button>
      </div></td>
    </tr>`).join('');
  wrap.innerHTML = `<table class="admin-table"><thead><tr><th></th><th>Name</th><th>Status</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function renderSubs() {
  const wrap = document.getElementById('subsTableWrap');
  const catMap = Object.fromEntries(allCats.map(c=>[c.id,c.name]));
  if (!allSubs.length) { wrap.innerHTML = `<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-title">No subjects yet</div></div>`; return; }
  const rows = allSubs.map(s => `
    <tr>
      <td><div style="font-weight:600;font-size:0.875rem;">${s.name}</div></td>
      <td><span class="badge badge-neutral">${catMap[s.categoryId]||'—'}</span></td>
      <td><div class="table-actions">
        <button class="btn btn-ghost btn-sm btn-icon" onclick="editSub('${s.id}')">✏️</button>
        <button class="btn btn-ghost btn-sm btn-icon" onclick="deleteSub('${s.id}')">🗑️</button>
      </div></td>
    </tr>`).join('');
  wrap.innerHTML = `<table class="admin-table"><thead><tr><th>Subject</th><th>Category</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}

function openCatModal(cat = null) {
  editingCatId = cat?.id || null;
  document.getElementById('catModalTitle').textContent = editingCatId ? 'Edit Category' : 'Add Category';
  document.getElementById('cName').value = cat?.name || '';
  document.getElementById('cIcon').value = cat?.icon || '';
  document.getElementById('cDesc').value = cat?.description || '';
  document.getElementById('cOrder').value = cat?.order ?? 1;
  document.getElementById('cActive').value = String(cat?.isActive ?? true);
  document.getElementById('cId').value = cat?.id || '';
  document.getElementById('catModal').classList.add('open');
}

function editCat(id) { openCatModal(allCats.find(c=>c.id===id)); }
function closeCatModal() { document.getElementById('catModal').classList.remove('open'); editingCatId = null; }

async function saveCategory() {
  const btn = document.getElementById('catSaveBtn');
  btn.disabled = true;
  const data = {
    name: document.getElementById('cName').value.trim(),
    icon: document.getElementById('cIcon').value || '📚',
    description: document.getElementById('cDesc').value.trim(),
    order: parseInt(document.getElementById('cOrder').value) || 1,
    isActive: document.getElementById('cActive').value === 'true',
  };
  if (!data.name) { showToast('Name required.','error'); btn.disabled=false; return; }
  try {
    if (editingCatId) await DB.categories.update(editingCatId, data, currentUser.uid);
    else await DB.categories.create(data, currentUser.uid);
    showToast('Saved!','success');
    closeCatModal();
    await loadAll();
  } catch(e) { showToast(e.message,'error'); }
  btn.disabled = false;
}

async function deleteCat(id) {
  if (confirm('Delete this category? Existing questions/sets will not be deleted.')) {
    await DB.categories.delete(id, currentUser.uid);
    showToast('Category deleted.','info');
    await loadAll();
  }
}

function openSubModal(sub = null) {
  editingSubId = sub?.id || null;
  document.getElementById('subModalTitle').textContent = editingSubId ? 'Edit Subject' : 'Add Subject';
  document.getElementById('sName').value = sub?.name || '';
  document.getElementById('sParentCat').value = sub?.categoryId || '';
  document.getElementById('sOrder').value = sub?.order ?? 1;
  document.getElementById('sId').value = sub?.id || '';
  document.getElementById('subModal').classList.add('open');
}

function editSub(id) { openSubModal(allSubs.find(s=>s.id===id)); }

async function saveSubject() {
  const btn = document.getElementById('subSaveBtn');
  btn.disabled = true;
  const data = {
    name: document.getElementById('sName').value.trim(),
    categoryId: document.getElementById('sParentCat').value,
    order: parseInt(document.getElementById('sOrder').value) || 1,
    isActive: true,
  };
  if (!data.name || !data.categoryId) { showToast('Name and category required.','error'); btn.disabled=false; return; }
  try {
    if (editingSubId) await DB.subjects.update(editingSubId, data, currentUser.uid);
    else await DB.subjects.create(data, currentUser.uid);
    showToast('Saved!','success');
    document.getElementById('subModal').classList.remove('open');
    await loadAll();
  } catch(e) { showToast(e.message,'error'); }
  btn.disabled = false;
}

async function deleteSub(id) {
  if (confirm('Delete this subject?')) {
    await DB.subjects.delete(id, currentUser.uid);
    showToast('Subject deleted.','info');
    await loadAll();
  }
}

init();
</script>
</body>
</html>
