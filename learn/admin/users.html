    </div>

    <div style="padding: 0 24px 12px;">

        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        Back to Homepage
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Management</div>
      <a href="/learn/admin/index.html" class="sidebar-link">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
        Dashboard

        Question Bank
      </a>
      <a href="/learn/admin/modelsets.html" class="sidebar-link">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
        Model Sets

        Users & Subscriptions

  <!-- MAIN -->
  <main class="main-content">
    <div class="page-topbar">
      <div>
        <h2 class="page-title">User Management</h2>
        <div class="page-subtitle">Manage student accounts and subscription tiers</div>
      </div>
    </div>

    <div class="page-body">
      <div class="card card-padded">
        <div style="display:flex; gap:12px; margin-bottom:20px;">
          <input type="text" id="searchUsers" placeholder="Search by name or email..." class="input-field" style="flex:1;" oninput="filterUsers()">
        </div>

        <div style="overflow-x:auto;">
          <table class="data-table" style="width:100%; text-align:left; border-collapse:collapse;">
            <thead>
              <tr style="border-bottom:1px solid var(--border);">
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;">Name</th>
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;">Email</th>
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;">Joined</th>
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;">Points</th>
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;">Streak</th>
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;">Plan</th>
                <th style="padding:12px;color:var(--text-muted);font-weight:600;font-size:0.875rem;text-align:right;">Actions</th>
              </tr>
            </thead>
            <tbody id="usersTableBody">
              <tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">Loading users...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { Auth } from '../js/auth.js';
window.Auth = Auth;

let allUsers = [];
let currentUser = null;

window.onload = async () => {
    Auth.onAuthStateChanged(async (user) => {
        if (!user) {
            window.location.href = '/learn/login.html';
            return;
        }
        document.getElementById('adminName').textContent = user.displayName || 'Admin';
        document.getElementById('adminEmail').textContent = user.email;
        currentUser = user;
        loadUsers();
    });
};

async function loadUsers() {
  try {
    const res = await fetch('/learn/backend/api/admin.php?action=getUsers', {
      headers: { 'Authorization': `Bearer ${currentUser.uid}` }
    }).then(r=>r.json());
    
    if (res && !res.error) {
      allUsers = res;
      renderUsers(allUsers);
    } else {
      alert(res.error || 'Failed to load users');
    }
  } catch(e) {
    console.error(e);
    alert('Error loading users');
  }
}

function renderUsers(users) {
  const tbody = document.getElementById('usersTableBody');
  if (users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">No users found.</td></tr>';
    return;
  }
  
  tbody.innerHTML = users.map(u => {
    const isPremium = u.subscription_tier === 'premium';
    const planBadge = isPremium 
      ? '<span class="badge badge-success">Premium</span>' 
      : '<span class="badge badge-neutral">Free</span>';
    
    const actionBtn = isPremium
      ? `<button class="btn btn-ghost btn-sm" onclick="togglePlan('${u.uid}', 'free')">Downgrade</button>`
      : `<button class="btn btn-primary btn-sm" onclick="togglePlan('${u.uid}', 'premium')">Make Premium</button>`;

    return `
      <tr style="border-bottom:1px solid var(--border);">
        <td style="padding:12px;font-weight:500;">${u.name || 'Unknown'}</td>
        <td style="padding:12px;color:var(--text-muted);">${u.email}</td>
        <td style="padding:12px;color:var(--text-muted);">${new Date(u.created_at).toLocaleDateString()}</td>
        <td style="padding:12px;font-weight:600;color:var(--primary);">${u.total_points || 0}</td>
        <td style="padding:12px;">${u.current_streak || 0} 🔥</td>
        <td style="padding:12px;">${planBadge}</td>
        <td style="padding:12px;text-align:right;">${actionBtn}</td>
      </tr>
    `;
  }).join('');
}

window.filterUsers = function() {
  const term = document.getElementById('searchUsers').value.toLowerCase();
  const filtered = allUsers.filter(u => 
    (u.name && u.name.toLowerCase().includes(term)) || 
    (u.email && u.email.toLowerCase().includes(term))
  );
  renderUsers(filtered);
}

window.togglePlan = async function(uid, newTier) {
  if (!confirm(`Are you sure you want to change this user's plan to ${newTier.toUpperCase()}?`)) return;
  
  try {
    const res = await fetch('/learn/backend/api/users.php?action=updateSubscription', {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${currentUser.uid}` },
        body: JSON.stringify({ targetUid: uid, tier: newTier })
    }).then(r=>r.json());
    
    if (res && res.success) {
      const user = allUsers.find(u => u.uid === uid);
      if (user) {
        user.subscription_tier = newTier;
        filterUsers();
      }
    } else {
      alert(res.error || 'Failed to update subscription');
    }
  } catch(e) {
    console.error(e);
    alert('Error updating subscription');
  }
}
</script>
</body>
</html>
