<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subjective Strategy | GyanBazi</title>
  <link rel="icon" href="/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/learn/css/learn-platform.css">
  <style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; }
    .layout { display: flex; height: 100vh; overflow: hidden; }
    .sidebar-topics {
      width: 300px;
      background: white;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .topic-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .topic-item {
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #374151;
      transition: 0.2s;
    }
    .topic-item:hover { background: #f3f4f6; }
    .topic-item.active {
      background: var(--primary-light);
      color: var(--primary-dark);
    }
    .main-area {
      flex: 1;
      overflow-y: auto;
      padding: 32px;
    }
    .question-card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }
    .q-text {
      font-size: 1.25rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .writing-guide {
      background: #fff7ed;
      border-left: 4px solid #f97316;
      padding: 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
      font-size: 0.95rem;
      color: #9a3412;
      line-height: 1.6;
    }
    .writing-guide h3 { margin-top:0; font-size: 1rem; color: #c2410c; }
    .writing-guide ul { padding-left: 20px; margin-bottom: 0; }
    
    .sample-answer-btn {
      background: #f1f5f9;
      color: #475569;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .sample-answer-btn:hover { background: #e2e8f0; }
    .sample-answer-content {
      margin-top: 16px;
      padding: 16px;
      background: #f8fafc;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="logo">NL</div>
  <div class="loading-spinner"></div>
</div>

<div class="layout" id="appLayout" style="display:none;">
  <!-- Sidebar -->
  <aside class="sidebar-topics">
    <div style="padding: 20px; border-bottom: 1px solid var(--border);">
      <a href="/learn/index.html" style="text-decoration:none; color:var(--text-muted); font-size:0.9rem; display:flex; align-items:center; gap:4px; margin-bottom:12px;">
        ← Back to Dashboard
      </a>
      <h2 style="font-size: 1.25rem; font-weight:800; margin:0;">Subjective Topics</h2>
    </div>
    <div class="topic-list" id="topicList">
      <div style="text-align:center; padding:20px; color:#6b7280;">Loading topics...</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-area">
    <div id="contentArea">
      <div style="text-align:center; padding-top: 100px;">
        <span style="font-size: 3rem;">✍️</span>
        <h2 style="color: #374151; margin-top: 16px;">Select a topic to start practicing</h2>
        <p style="color: #6b7280;">Master the art of writing precise answers.</p>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/learn/js/firebase-config.js"></script>
<script>
  let currentUser = null;
  const urlParams = new URLSearchParams(window.location.search);
  const vacancyId = urlParams.get('vacancy');

  document.addEventListener("DOMContentLoaded", () => {
    auth.onAuthStateChanged(async (user) => {
      if (!user || !vacancyId) {
        window.location.href = '/learn/index.html';
        return;
      }
      currentUser = user;
      document.getElementById('pageLoader').style.display = 'none';
      document.getElementById('appLayout').style.display = 'flex';
      loadTopics();
    });
  });

  async function loadTopics() {
    try {
      const topics = await fetch(`/learn/backend/api/subjective.php?action=getTopics&vacancyId=${vacancyId}`, {
        headers: { 'Authorization': `Bearer ${currentUser.uid}` }
      }).then(r=>r.json());
      
      const list = document.getElementById('topicList');
      if (Array.isArray(topics) && topics.length > 0) {
        list.innerHTML = topics.map(t => `
          <div class="topic-item" id="topic-${t.id}" onclick="loadQuestions('${t.id}')">
            ${t.title}
          </div>
        `).join('');
      } else {
        list.innerHTML = '<div style="text-align:center; padding:20px; color:#6b7280;">No subjective topics available for this course.</div>';
      }
    } catch(e) {
      document.getElementById('topicList').innerHTML = '<div style="color:red; padding:16px;">Failed to load topics.</div>';
    }
  }

  async function loadQuestions(topicId) {
    // Update active class
    document.querySelectorAll('.topic-item').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById(`topic-${topicId}`);
    if(activeEl) activeEl.classList.add('active');

    const contentArea = document.getElementById('contentArea');
    contentArea.innerHTML = '<div style="text-align:center; padding:40px; color:#6b7280;">Loading questions...</div>';

    try {
      const data = await fetch(`/learn/backend/api/subjective.php?action=getQuestions&topicId=${topicId}`, {
        headers: { 'Authorization': `Bearer ${currentUser.uid}` }
      }).then(r=>r.json());

      if (data && data.questions && data.questions.length > 0) {
        let html = `<h2 style="font-size:1.75rem; font-weight:800; margin-bottom:24px; color:#111827;">${data.topicTitle}</h2>`;
        
        html += data.questions.map((q, i) => `
          <div class="question-card">
            <div style="font-size:0.85rem; font-weight:700; color:var(--primary); margin-bottom:8px; text-transform:uppercase;">Question ${i+1}</div>
            <div class="q-text">${q.question_text}</div>
            <div class="writing-guide">
              ${q.writing_guide}
            </div>
            ${q.sample_answer ? `
              <button class="sample-answer-btn" onclick="toggleAnswer('ans-${q.id}')">Show Sample Answer</button>
              <div class="sample-answer-content" id="ans-${q.id}">
                ${q.sample_answer}
              </div>
            ` : ''}
          </div>
        `).join('');
        
        contentArea.innerHTML = html;
      } else {
        contentArea.innerHTML = `
          <div style="text-align:center; padding-top: 100px;">
            <h2 style="color: #374151;">No questions added yet</h2>
            <p style="color: #6b7280;">Admins are working on adding materials for this topic.</p>
          </div>
        `;
      }
    } catch(e) {
      contentArea.innerHTML = '<div style="color:red;">Failed to load questions.</div>';
    }
  }

  function toggleAnswer(id) {
    const el = document.getElementById(id);
    if(el.style.display === 'block') {
      el.style.display = 'none';
    } else {
      el.style.display = 'block';
    }
  }
</script>
</body>
</html>
