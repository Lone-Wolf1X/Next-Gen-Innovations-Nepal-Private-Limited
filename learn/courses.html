<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Your Path | GyanBazi</title>
  <link rel="icon" href="/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/learn/css/learn-platform.css">
  <style>
    body { 
      background: #f8fafc; 
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      padding: 60px 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 50px;
    }
    .header h1 {
      font-size: 2.5rem;
      font-weight: 800;
      color: #111827;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .header p {
      font-size: 1.1rem;
      color: #6b7280;
    }
    .course-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }
    .course-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      transition: 0.3s ease;
      display: flex;
      flex-direction: column;
    }
    .course-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.08);
      border-color: #c7d2fe;
    }
    .course-category {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .course-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .course-desc {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 24px;
      flex: 1;
    }
    .course-meta {
      display: flex;
      gap: 15px;
      margin-bottom: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-enroll {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #6366f1);
      color: white;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-enroll:hover {
      box-shadow: 0 8px 15px rgba(79, 70, 229, 0.3);
    }
    .btn-enroll:disabled {
      background: #9ca3af;
      cursor: not-allowed;
      box-shadow: none;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.7rem;
      font-weight: 700;
      margin-right: 6px;
    }
    .badge-obj { background: #eef2ff; color: #4338ca; }
    .badge-subj { background: #fff7ed; color: #c2410c; }
  </style>
</head>
<body>

<div class="page-loader" id="pageLoader">
  <div class="logo">NL</div>
  <div class="loading-spinner"></div>
</div>

<div class="container">
  <div class="header">
    <h1>Choose Your Target Exam 🎯</h1>
    <p>Enroll in a preparation course to unlock your tailored study roadmap.</p>
  </div>
  
  <div class="course-grid" id="courseGrid">
    <!-- Rendered via JS -->
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="/learn/js/firebase-config.js"></script>
<script>
  let currentUser = null;

  document.addEventListener("DOMContentLoaded", () => {
    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = '/learn/login.html?next=/learn/courses.html';
        return;
      }
      currentUser = user;
      document.getElementById('pageLoader').style.display = 'none';
      loadCourses();
    });
  });

  async function loadCourses() {
    const grid = document.getElementById('courseGrid');
    grid.innerHTML = '<div style="text-align:center;width:100%;color:#6b7280;">Loading courses...</div>';
    
    try {
      const res = await fetch('/learn/backend/api/vacancies.php?action=list').then(r=>r.json());
      if(Array.isArray(res)) {
        grid.innerHTML = res.map(v => `
          <div class="course-card">
            <div class="course-category">${v.category_name}</div>
            <h2 class="course-title">${v.title}</h2>
            <div style="margin-bottom:12px;">
              ${v.has_objective ? '<span class="badge badge-obj">Objective (MCQs)</span>' : ''}
              ${v.has_subjective ? '<span class="badge badge-subj">Subjective Guide</span>' : ''}
            </div>
            <p class="course-desc">${v.description}</p>
            <div class="course-meta">
              <div class="meta-item">📅 Exam: ${v.exam_date ? v.exam_date : 'TBA'}</div>
            </div>
            <button class="btn-enroll" onclick="enroll('${v.id}', this)">Enroll Now</button>
          </div>
        `).join('');
      } else {
        grid.innerHTML = '<div style="text-align:center;width:100%;color:#6b7280;">No courses available right now.</div>';
      }
    } catch(e) {
      grid.innerHTML = '<div style="text-align:center;width:100%;color:#ef4444;">Failed to load courses.</div>';
    }
  }

  async function enroll(vacancyId, btnElement) {
    btnElement.disabled = true;
    btnElement.textContent = 'Enrolling...';
    try {
      const res = await fetch('/learn/backend/api/vacancies.php?action=enroll', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + currentUser.uid
        },
        body: JSON.stringify({ vacancyId })
      }).then(r=>r.json());

      if(res.success) {
        btnElement.textContent = 'Enrolled! Redirecting...';
        btnElement.style.background = '#10b981';
        setTimeout(() => {
          window.location.href = '/learn/index.html';
        }, 1000);
      } else {
        alert(res.error || 'Failed to enroll');
        btnElement.disabled = false;
        btnElement.textContent = 'Enroll Now';
      }
    } catch(e) {
      alert('Network error during enrollment');
      btnElement.disabled = false;
      btnElement.textContent = 'Enroll Now';
    }
  }
</script>
</body>
</html>
