<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Categories | GyanBazi</title>
  <link rel="icon" href="/logo/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/learn/css/learn-platform.css">
  <link rel="manifest" href="/learn/manifest.json">
  <meta name="theme-color" content="#2563eb">
</head>
<body>
<div class="page-loader" id="pageLoader"><div class="logo">NL</div><div class="loading-spinner"></div></div>

<div class="app-layout" id="appLayout" style="display:none;">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">NL</div>
      <div><div class="sidebar-name">GyanBazi</div><div class="sidebar-tagline">Exam Preparation</div></div>
    </div>
    <div style="padding: 0 24px 12px;">
      <a href="/learn/homepage.html" class="sidebar-link" style="padding: 8px 12px; background: rgba(79, 70, 229, 0.05); color: var(--primary); border: 1px solid rgba(79, 70, 229, 0.2);">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        Back to Homepage
      </a>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-title">Main</div>
      <a href="/learn/index.html" class="sidebar-link">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"/></svg>
        Dashboard
      </a>
      <a href="/learn/categories.html" class="sidebar-link active">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/></svg>
        Browse Courses
      </a>
      
      <div class="sidebar-section-title">Enrolled Courses</div>
      <div id="enrolledCoursesList">
        <!-- Dynamically populated -->
        <div class="sidebar-link" style="opacity:0.5;">Loading...</div>
      </div>

      <div class="sidebar-section-title">My Learning</div>
      <a href="/learn/profile.html" class="sidebar-link">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
        My Profile
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user" onclick="handleSignOut()">
        <div class="sidebar-avatar" id="userAvatar">U</div>
        <div class="sidebar-user-info"><div class="sidebar-user-name" id="userName">User</div><div class="sidebar-user-email" id="userEmail">...</div></div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-topbar">
      <div><div class="page-title">Exam Categories</div><div class="page-subtitle">Choose your target exam to begin</div></div>
    </div>
    <div class="page-body">
      <div class="category-grid" id="coursesGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;">
        <div class="skeleton" style="height:200px;border-radius:var(--radius-lg);"></div>
        <div class="skeleton" style="height:200px;border-radius:var(--radius-lg);"></div>
        <div class="skeleton" style="height:200px;border-radius:var(--radius-lg);"></div>
      </div>
    </div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="/learn/js/firebase-config.js"></script>
<script src="/learn/js/auth.js?v=5"></script>
<script src="/learn/js/db.js?v=6"></script>
<script>
async function init() {
  const user = await Auth.requireAuth();
  setUserUI(user);
  
  try {
    // Fetch all courses
    const allCourses = await fetch('/learn/backend/api/vacancies.php?action=list').then(r => r.json());
    // Fetch user enrollments
    const enrollments = await fetch('/learn/backend/api/vacancies.php?action=myEnrollments', {
      headers: { 'Authorization': `Bearer ${user.uid}` }
    }).then(r => r.json());
    
    renderCourses(allCourses, enrollments || [], user.uid);
  } catch(e) {
    console.error(e);
    document.getElementById('coursesGrid').innerHTML = '<p>Error loading courses.</p>';
  }

  document.getElementById('pageLoader').style.display = 'none';
  document.getElementById('appLayout').style.display = 'flex';
}

function setUserUI(user) {
  if (user.photoURL) document.getElementById('userAvatar').innerHTML = `<img src="${user.photoURL}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">`;
  else document.getElementById('userAvatar').textContent = (user.displayName||'U')[0].toUpperCase();
  document.getElementById('userName').textContent = user.displayName || 'User';
  document.getElementById('userEmail').textContent = user.email;
}

function renderCourses(courses, enrollments, uid) {
  const container = document.getElementById('coursesGrid');
  if (!courses || courses.length === 0) {
    container.innerHTML = `
      <div class="empty-state" style="grid-column:1/-1;">
        <div class="empty-icon">📚</div>
        <div class="empty-title">No courses available</div>
        <div class="empty-desc">The admin is setting up courses. Please check back soon.</div>
      </div>`;
    return;
  }
  
  const enrolledIds = enrollments.map(e => e.id);
  
  // Populate sidebar
  const enrolledContainer = document.getElementById('enrolledCoursesList');
  if (enrollments && enrollments.length > 0) {
    enrolledContainer.innerHTML = '';
    enrollments.forEach(enroll => {
      const courseTitle = enroll.title || 'Course';
      enrolledContainer.innerHTML += `
        <a href="/learn/course.html?id=${enroll.id}" class="sidebar-link">
          <svg class="icon" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
          ${courseTitle}
        </a>
      `;
    });
  } else {
    enrolledContainer.innerHTML = `
      <div style="padding: 12px 24px; font-size: 0.85rem; color: var(--text-muted);">
        No courses enrolled yet.
      </div>
    `;
  }

  container.innerHTML = courses.map(c => {
    const isEnrolled = enrolledIds.includes(c.id);
    return `
      <div class="card card-padded" style="display:flex; flex-direction:column; justify-content:space-between; height: 100%;">
        <div>
          <div style="font-size:0.8rem; font-weight:600; color:var(--primary); margin-bottom:8px; text-transform:uppercase; letter-spacing:1px;">${c.category_name}</div>
          <h3 style="font-size:1.1rem; font-weight:700; color:var(--text-primary); margin-bottom:12px; line-height:1.4;">${c.title}</h3>
          <p style="font-size:0.9rem; color:var(--text-muted); margin-bottom:16px; line-height:1.6;">${c.description || 'Join this course to start your preparation.'}</p>
        </div>
        <div>
          ${isEnrolled 
            ? `<a href="/learn/course.html?id=${c.id}" class="btn btn-outline" style="width:100%;">Go to Course</a>`
            : `<button class="btn btn-primary" style="width:100%;" onclick="enrollCourse('${c.id}', '${uid}')">Enroll Now</button>`
          }
        </div>
      </div>
    `;
  }).join('');
}

async function enrollCourse(vacancyId, uid) {
  if (!confirm("Do you want to enroll in this course?")) return;
  
  try {
    const res = await fetch('/learn/backend/api/vacancies.php?action=enroll', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${uid}`
      },
      body: JSON.stringify({ vacancyId })
    }).then(r => r.json());
    
    if (res.success) {
      alert("Enrolled successfully!");
      window.location.href = `/learn/course.html?id=${vacancyId}`;
    } else {
      alert("Error: " + (res.error || "Could not enroll"));
    }
  } catch(e) {
    alert("Network error occurred.");
    console.error(e);
  }
}

async function handleSignOut() {
  if (confirm('Sign out?')) await Auth.signOut();
}
init();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/learn/sw.js')
        .then(reg => console.log('SW registered'))
        .catch(err => console.log('SW fail: ', err));
    });
  }
</script>
</body>
</html>
