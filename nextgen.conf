<VirtualHost *:80>
    ServerName nextgeninnovations.com.np
    ServerAlias www.nextgeninnovations.com.np

    ProxyPreserveHost On
    ProxyPass / http://localhost:3001/
    ProxyPassReverse / http://localhost:3001/

    ErrorLog ${APACHE_LOG_DIR}/nextgen_error.log
    CustomLog ${APACHE_LOG_DIR}/nextgen_access.log combined
</VirtualHost>
